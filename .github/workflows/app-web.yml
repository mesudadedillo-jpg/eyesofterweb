# Compila la versión web de la app (Kotlin/Wasm, kmp/) en cada cambio, para detectar errores
# antes de que lleguen a Railway: portal/Dockerfile la compila igual y la publica en /app-web.
name: App web

on:
  push:
    paths:
      - "kmp/**"
      - "portal/Dockerfile"
      - ".github/workflows/app-web.yml"
  pull_request:
    paths:
      - "kmp/**"
      - "portal/Dockerfile"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: kmp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar la app web
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:webApp:wasmJsBrowserDistribution
          # Misma carpeta que copia portal/Dockerfile:
          ls -la app/webApp/build/dist/wasmJs/productionExecutable
          test -f app/webApp/build/dist/wasmJs/productionExecutable/index.html
