# Compila la app de iPhone (kmp/app/iosApp) para el simulador, sin firmar, en cada cambio.
# Sirve para detectar errores del código iOS (iosMain) aunque nadie del equipo tenga Mac.
# Publicar en TestFlight requiere la cuenta de Apple Developer (ver docs/MONOREPO_AVANCE.md).
name: iOS

on:
  push:
    paths:
      - "kmp/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "kmp/**"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  simulador:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Configuración de Firebase (opcional)
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          # Sin este secreto la app compila igual, pero sin push (iOSApp.swift lo detecta).
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > kmp/app/iosApp/iosApp/GoogleService-Info.plist
            echo "Push en iOS: activadas"
          else
            echo "::notice::Sin GOOGLE_SERVICE_INFO_PLIST: la app de iPhone no tendrá push."
          fi
      - name: Descargar paquetes de Swift (Firebase)
        working-directory: kmp/app/iosApp
        run: xcodebuild -resolvePackageDependencies -project iosApp.xcodeproj
      - name: Compilar para el simulador de iPhone
        working-directory: kmp/app/iosApp
        run: |
          chmod +x ../../gradlew
          xcodebuild -project iosApp.xcodeproj -target iosApp -configuration Debug \
            -sdk iphonesimulator -arch arm64 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Comprobar que se generó la app
        working-directory: kmp/app/iosApp
        run: |
          app=$(find build -name '*.app' -maxdepth 4 | head -n 1)
          if [ -z "$app" ]; then echo "::error::No se generó el .app"; exit 1; fi
          echo "App generada: $app"; du -sh "$app"
